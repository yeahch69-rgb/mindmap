<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>프로젝트 마인드맵 (Project Mindmap)</title>

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1B4332" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="마인드맵" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Pretendard (KO/JP CJK) & Noto Sans JP -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-jp-dynamic-subset.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var mode = window.innerWidth < 1024 ? 'mobile' : 'desktop';
        var key = mode === 'mobile' ? 'pm_font_percent_mobile' : 'pm_font_percent_desktop';
        var saved = localStorage.getItem(key);
        var p = saved ? parseInt(saved, 10) || 100 : 100;
        p = Math.min(150, Math.max(80, Math.round(p / 5) * 5));
        document.documentElement.style.fontSize = '16px';
        document.documentElement.style.setProperty('--font-offset', (p - 100) / 5 + 'px');
      } catch (_) {}
    </script>
  </head>
  <body class="bg-ivory-100 text-charcoal-900 antialiased selection:bg-forest-100 selection:text-forest-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              console.log('PWA ServiceWorker registered:', reg.scope);
            })
            .catch(function (err) {
              console.log('PWA ServiceWorker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
